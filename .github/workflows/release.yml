name: Native builds and tests
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish v1.1.0 after all native tests pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            target: windows-x64
          - os: windows-2022
            arch: x86
            target: windows-x86
          - os: macos-15-intel
            arch: x64
            target: macos-x64
          - os: macos-15
            arch: arm64
            target: macos-arm64
          - os: ubuntu-22.04
            arch: x64
            target: linux-x64
          - os: ubuntu-22.04-arm
            arch: arm64
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk xvfb
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py --platform ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum *.exe *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.1.0 release/* --target "$GITHUB_SHA" --title "v1.1.0 · 分卷、封面与多平台" --notes-file RELEASE_NOTES.md
